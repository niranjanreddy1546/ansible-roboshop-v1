- name: Creating EC2 instance and updating R53 Records.
  hosts: local
  connection: local
  vars: 
    instances: ["mongodb"]
    # instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: create
    domain_name: mymango.online
    ami_id: ami-0055977a6e828a4f4

  tasks: 

    - name: create ec2 instance
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        instance_type: t3.small
        image_id: "{{ ami_id }}"
        security_group: 
          - roboshop-common
          - "roboshop-{{ item }}"
        region: us-east-1
      loop: "{{ instances }}"
      when: action == "create"
      register: ec2_output

    - name: create R53 record
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}.{{ domain_name }}" 
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when: action == "create"

    - name: delete R53 records
      amazon.aws.route53:
        state: absent
        zone: "{{ domain_name }}"
        record: "{{ item }}.{{ domain_name }}"
        ttl: 1
        type: A
      loop: "{{ instances }}"
      when: action == "delete"

    - name: delete ec2 instances
      amazon.aws.ec2_instance:
        state: absent
        name: "roboshop-{{ item }}"
        region: us-east-1
        wait: false
      loop: "{{ instances }}"
      when: action == "delete"